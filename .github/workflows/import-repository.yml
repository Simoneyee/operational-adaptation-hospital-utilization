name: Import repository package

on:
  push:
    paths:
      - 'repo_bundle.part10'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode and unpack repository bundle
        shell: bash
        run: |
          set -euo pipefail
          cat repo_bundle.part01 repo_bundle.part02 repo_bundle.part03 repo_bundle.part04 repo_bundle.part05 repo_bundle.part06 repo_bundle.part07 repo_bundle.part08 repo_bundle.part09 repo_bundle.part10 > /tmp/repo.b64
          base64 -d /tmp/repo.b64 > /tmp/repo.zip
          rm -rf /tmp/unpack
          mkdir -p /tmp/unpack
          unzip -q /tmp/repo.zip -d /tmp/unpack
          cp -a /tmp/unpack/operational-adaptation-hospital-utilization/. .
          rm -f repo_bundle.b64 repo_bundle.part01 repo_bundle.part02 repo_bundle.part03 repo_bundle.part04 repo_bundle.part05 repo_bundle.part06 repo_bundle.part07 repo_bundle.part08 repo_bundle.part09 repo_bundle.part10
          rm -f .github/workflows/import-repository.yml

      - name: Commit imported repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Import complete reproducibility package'
            git push
          fi
